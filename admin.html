<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14532D">
<title>Panel Admin — Pondok Pesantren</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314532D'/%3E%3Cpath d='M16 6l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z' fill='%23D9A441'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try{var m=localStorage.getItem('pp:mode');if(m==='gelap'||(!m&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<div id="login" hidden class="min-h-screen grid place-items-center p-4 bg-gradient-to-br from-brand-deep to-brand">
  <div class="glass-2 rounded-[28px] w-full max-w-md p-7 sm:p-10 shadow-lift">
    <div class="flex items-center gap-3 mb-6"><span class="w-12 h-12 rounded-2xl bg-brand text-on-brand grid place-items-center" id="lg-ic"></span><div><div class="font-extrabold text-xl text-ink" id="lg-nama">Panel Admin</div><div class="text-sm text-ink2">Sistem Informasi Pesantren</div></div></div>
    <h1 class="text-2xl mb-1 text-ink">Masuk</h1><p class="text-ink2 text-sm mb-6">Gunakan akun Google yang terdaftar sebagai admin.</p>
    <div id="g-btn" class="min-h-[44px] mb-2 flex justify-center"></div>
    <p class="text-sm text-danger min-h-[1.25rem]" id="lg-err" role="alert"></p>
    <details class="mt-4"><summary class="cursor-pointer text-sm font-semibold text-ink2 min-h-[44px] flex items-center">Login darurat Superadmin</summary>
      <form id="f-darurat" class="grid gap-3 mt-3" novalidate><div><label class="label" for="d-em">Email Superadmin</label><input class="field" id="d-em" type="email" autocomplete="username" required></div><div><label class="label" for="d-pw">Sandi darurat</label><input class="field" id="d-pw" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Masuk</button></form></details>
    <a href="index.html" class="mt-6 inline-flex items-center gap-2 text-sm font-semibold text-ink2 min-h-[44px]" id="lg-back"></a>
  </div>
</div>
<div id="app" hidden class="min-h-screen lg:grid lg:grid-cols-[264px_1fr]">
  <aside id="side" class="hidden lg:flex flex-col fixed lg:sticky top-0 h-screen w-[280px] lg:w-auto z-[70] bg-surf border-r border-line/60 p-4 overflow-y-auto">
    <div class="flex items-center gap-3 px-2 py-3 mb-3"><span class="w-11 h-11 rounded-xl bg-brand text-on-brand grid place-items-center" id="sd-ic"></span><div class="min-w-0"><div class="font-extrabold text-brand dark:text-sec truncate" id="sd-nama">Panel Admin</div><div class="text-xs text-ink2">Kelola pesantren</div></div></div>
    <nav id="menu" class="grid gap-1" aria-label="Menu admin"></nav>
    <div class="mt-auto pt-4 grid gap-1"><a class="side-link" href="index.html" target="_blank" rel="noopener" id="lnk-publik"></a><button class="side-link w-full text-left" id="btn-keluar"></button></div>
  </aside>
  <div id="scrim" hidden class="fixed inset-0 bg-black/50 z-[65] lg:hidden"></div>
  <div class="min-w-0 flex flex-col">
    <header class="sticky top-0 z-40 glass !rounded-none border-x-0 border-t-0"><div class="px-4 sm:px-6 h-[64px] flex items-center gap-3">
      <button class="btn-icon lg:hidden" id="burger" aria-label="Buka menu"></button>
      <h1 class="text-lg sm:text-xl font-extrabold truncate" id="judul-hal">Dashboard</h1>
      <div class="ml-auto flex items-center gap-2">
        <span class="badge b-ok hidden md:inline-flex" id="chip-periode"></span><span class="badge b-warn hidden md:inline-flex" id="chip-kuota"></span><span class="badge b-off hidden sm:inline-flex" id="chip-ms" title="Rata-rata waktu respons"></span>
        <button class="btn-icon" id="tema" aria-label="Ganti mode terang/gelap"></button>
        <div class="flex items-center gap-2 pl-2"><span class="w-10 h-10 rounded-full bg-brand text-on-brand grid place-items-center font-bold" id="avatar">A</span><div class="hidden sm:block leading-tight"><div class="text-sm font-bold" id="u-nama"></div><div class="text-xs text-ink2" id="u-peran"></div></div></div>
      </div></div></header>
    <main id="pages" class="p-4 sm:p-6 lg:p-8 pb-24 max-w-[1400px] w-full"></main>
  </div>
</div>
<script src="js/config.js" defer></script>
<script src="js/icons.js" defer></script>
<script src="js/core.js" defer></script>
<script src="js/admin.js" defer></script>
<script src="js/admin-pages.js" defer></script>
<script src="js/admin-konten.js" defer></script>
<script src="js/admin-mod.js" defer></script>
<script src="js/admin-start.js" defer></script>
</body>
</html>
